<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d32118" />
    <title>DARUMA</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 一覧と詳細。画面が広いとき（Fold を開いたとき）は横に並べる -->
    <div class="shell">
    <!-- ------------------------------------------------ 一覧 -->
    <div id="listView" class="view">
      <header class="top">
        <img class="mark" src="icons/icon-192.png" alt="" />
        <span class="title">DARUMA</span>
        <span class="spacer"></span>
        <button id="openNotes" class="icon-btn" title="ノート" aria-label="ノート">📝</button>
        <button id="refresh" class="icon-btn" title="Drive から取り込む" aria-label="更新">⟳</button>
        <button id="openSettings" class="icon-btn" title="設定" aria-label="設定">⚙</button>
      </header>

      <div class="searchbar">
        <input id="q" type="search" placeholder="タイトル・チャンネル・本文を検索" autocomplete="off" />
      </div>

      <div id="chans" class="chips"></div>
      <div id="status" class="status"></div>
      <main id="list" class="list"></main>
    </div>

    <!-- 2ペインのときだけ出る仕切り。ドラッグで幅を変えられる -->
    <div
      id="splitter"
      class="splitter"
      role="separator"
      aria-orientation="vertical"
      aria-label="一覧の幅を変更"
      tabindex="0"
    >
      <span id="splitterHint" class="splitter-hint"></span>
    </div>

    <!-- ------------------------------------------------ 詳細 -->
    <div id="detailView" class="view detail" hidden>
      <header class="top">
        <button id="back" class="icon-btn" aria-label="戻る">‹</button>
        <span class="title" id="detailTitle"></span>
      </header>
      <main id="detail" class="detail-body"></main>
    </div>
    </div><!-- /.shell -->

    <!-- ------------------------------------------------ ノート -->
    <div id="notesView" class="view" hidden>
      <header class="top">
        <button id="closeNotes" class="icon-btn" aria-label="戻る">‹</button>
        <span class="title">ノート</span>
      </header>
      <div class="searchbar">
        <input id="noteQ" type="search" placeholder="ハイライト・メモ・動画名を検索" autocomplete="off" />
      </div>
      <main id="noteList" class="list"></main>
    </div>

    <!-- ------------------------------------------------ 設定 -->
    <div id="settingsView" class="view" hidden>
      <header class="top">
        <button id="closeSettings" class="icon-btn" aria-label="戻る">‹</button>
        <span class="title">設定</span>
      </header>
      <main class="settings">
        <section>
          <h2>Google 連携</h2>
          <label for="clientId">OAuth クライアント ID</label>
          <input id="clientId" type="text" spellcheck="false" placeholder="xxxxx.apps.googleusercontent.com" />
          <p class="hint">
            Google Cloud コンソールで作成した「ウェブ アプリケーション」のクライアント ID です。
            承認済みの JavaScript 生成元に、このページの URL
            <code id="originHint"></code> を登録しておいてください。
          </p>
          <div class="row">
            <button id="saveClientId" class="btn">保存</button>
            <button id="signIn" class="btn primary">Google と連携する</button>
            <button id="signOut" class="btn">連携を解除</button>
          </div>
          <p id="authStatus" class="status"></p>
        </section>

        <section>
          <h2>データ</h2>
          <p class="hint">
            拡張機能が Drive に書き出した <code>daruma-archive.json</code> を読み込みます。
            一度取り込めば、オフラインでも閲覧できます。
          </p>
          <p id="dataStatus" class="status"></p>
          <button id="clearCache" class="btn">取り込んだ要約を消す</button>
        </section>

        <section>
          <h2>アプリ</h2>
          <p id="diag" class="status"></p>
          <p class="hint">
            アプリ本体はオフラインでも動くよう端末に保存されています。
            更新しても画面が変わらないときは、下のボタンで入れ替えてください。
          </p>
          <div class="row">
            <button id="updateApp" class="btn primary">アプリを更新する</button>
          </div>
        </section>
      </main>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
